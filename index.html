<!DOCTYPE html>
<html>
<head>
  <title>Work Order Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f5f9; margin: 0; padding: 40px 16px; }
    h1 { text-align: center; color: #1f3b57; }
    form { max-width: 480px; margin: 0 auto; background: white; padding: 24px;
           border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    label { display: block; font-weight: bold; color: #333; margin-bottom: 14px; }
    input, textarea, select { display: block; width: 100%; box-sizing: border-box; margin-top: 6px;
           padding: 10px; border: 1px solid #ccd5df; border-radius: 8px; font-size: 15px; }
    textarea { min-height: 80px; }
    button { width: 100%; padding: 12px; background: #2f80ed; color: white; border: none;
             border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1c64c7; }
    br { display: none; }
  </style>
</head>
<body>
  <h1>Work Order Tracker</h1>
  <form>
    <label>Title <input type="text" name="title"></label><br>
    <label>Description <textarea name="description"></textarea></label><br>
    <label>Location <input type="text" name="location"></label><br>
    <label>Priority
      <select name="priority">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>
    </label><br>
    <label>Due date <input type="date" name="due"></label><br>
    <button type="submit">Create work order</button>
  </form>
</body>
</html>
